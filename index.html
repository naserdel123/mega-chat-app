<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MegaChat - تطبيق المراسلة</title>
    
    <!-- CSS Files -->
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/themes.css">
    <link rel="stylesheet" href="css/responsive.css">
    
    <!-- External Libraries -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Meta Tags -->
    <meta name="description" content="تطبيق مراسلة فائق السرعة">
    <meta name="theme-color" content="#667eea">
    <link rel="manifest" href="manifest.json">
</head>
<body data-theme="dark">
    <!-- شاشة التحميل البسيطة -->
    <div id="preloader" class="preloader">
        <div class="preloader-content">
            <div class="logo-3d">
                <div class="cube">
                    <div class="face front"></div>
                    <div class="face back"></div>
                    <div class="face right"></div>
                    <div class="face left"></div>
                    <div class="face top"></div>
                    <div class="face bottom"></div>
                </div>
            </div>
            <h1 class="loading-text">MegaChat</h1>
            <div class="progress-container">
                <div class="progress-bar" id="progressBar"></div>
                <span class="progress-text" id="progressText">0%</span>
            </div>
        </div>
    </div>

    <!-- التطبيق الرئيسي -->
    <div id="app" class="app hidden">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="brand">
                    <div class="logo-icon">
                        <i class="fas fa-comments"></i>
                    </div>
                    <span class="brand-name">MegaChat</span>
                </div>
                <button class="btn-icon" id="sidebarToggle">
                    <i class="fas fa-bars"></i>
                </button>
            </div>

            <!-- قائمة المستخدم -->
            <div class="user-card">
                <div class="user-avatar-container">
                    <img src="https://i.pravatar.cc/150?img=11" alt="User" class="user-avatar" id="currentUserAvatar">
                    <div class="status-ring online"></div>
                </div>
                <div class="user-info">
                    <h3 id="currentUserName">أحمد محمد</h3>
                    <p class="user-status" id="currentUserStatus">متصل الآن</p>
                </div>
                <button class="btn-icon dropdown-toggle" id="userMenuBtn">
                    <i class="fas fa-ellipsis-v"></i>
                </button>
                
                <!-- قائمة منسدلة -->
                <div class="dropdown-menu" id="userDropdown">
                    <a href="profile.html" class="dropdown-item">
                        <i class="fas fa-user"></i>
                        <span>الملف الشخصي</span>
                    </a>
                    <a href="settings.html" class="dropdown-item">
                        <i class="fas fa-cog"></i>
                        <span>الإعدادات</span>
                    </a>
                    <div class="dropdown-divider"></div>
                    <a href="#" class="dropdown-item text-danger" id="logoutBtn">
                        <i class="fas fa-sign-out-alt"></i>
                        <span>خروج</span>
                    </a>
                </div>
            </div>

            <!-- صندوق البحث -->
            <div class="search-section">
                <div class="search-box">
                    <i class="fas fa-search search-icon"></i>
                    <input type="text" placeholder="بحث في المحادثات..." id="globalSearch">
                </div>
            </div>

            <!-- تبويبات المحادثات -->
            <div class="tabs-container">
                <div class="tabs-header">
                    <button class="tab-btn active" data-tab="chats">
                        <i class="fas fa-comment"></i>
                        <span>المحادثات</span>
                        <span class="badge" id="chatsBadge">3</span>
                    </button>
                    <button class="tab-btn" data-tab="groups">
                        <i class="fas fa-users"></i>
                        <span>المجموعات</span>
                    </button>
                </div>

                <!-- قائمة المحادثات -->
                <div class="tab-content active" id="chatsTab">
                    <div class="conversations-list" id="conversationsList"></div>
                </div>

                <!-- المجموعات -->
                <div class="tab-content" id="groupsTab">
                    <div class="groups-list" id="groupsList"></div>
                </div>
            </div>

            <!-- زر محادثة جديدة -->
            <button class="fab-btn" id="newChatBtn">
                <i class="fas fa-plus"></i>
            </button>
        </aside>

        <!-- منطقة الدردشة الرئيسية -->
        <main class="chat-area" id="chatArea">
            <!-- حالة فارغة -->
            <div class="empty-state" id="emptyState">
                <div class="empty-illustration">
                    <div class="floating-icons">
                        <i class="fas fa-comment-alt"></i>
                        <i class="fas fa-heart"></i>
                        <i class="fas fa-paper-plane"></i>
                    </div>
                </div>
                <h2>اختر محادثة للبدء</h2>
                <p>اختر جهة اتصال من القائمة لبدء المحادثة</p>
            </div>

            <!-- واجهة الدردشة -->
            <div class="chat-interface hidden" id="chatInterface">
                <!-- Header -->
                <header class="chat-header">
                    <div class="chat-header-info">
                        <button class="btn-icon mobile-back" id="mobileBack">
                            <i class="fas fa-arrow-right"></i>
                        </button>
                        
                        <div class="chat-user-info" id="chatUserInfo">
                            <div class="avatar-container">
                                <img src="" alt="" class="chat-avatar" id="chatAvatar">
                                <div class="status-indicator" id="chatStatus"></div>
                            </div>
                            <div class="chat-meta">
                                <h3 id="chatName"></h3>
                                <span class="chat-status-text" id="chatStatusText"></span>
                            </div>
                        </div>
                    </div>

                    <div class="chat-header-actions">
                        <button class="btn-icon" id="voiceCallBtn">
                            <i class="fas fa-phone"></i>
                        </button>
                        <button class="btn-icon" id="videoCallBtn">
                            <i class="fas fa-video"></i>
                        </button>
                        <button class="btn-icon" id="chatInfoBtn">
                            <i class="fas fa-info-circle"></i>
                        </button>
                    </div>
                </header>

                <!-- منطقة الرسائل -->
                <div class="messages-container" id="messagesContainer">
                    <div class="chat-date-divider">
                        <span>اليوم</span>
                    </div>
                    <div class="messages-list" id="messagesList"></div>
                    
                    <!-- مؤشر الكتابة -->
                    <div class="typing-indicator hidden" id="typingIndicator">
                        <div class="typing-bubble">
                            <span></span>
                            <span></span>
                            <span></span>
                        </div>
                        <span class="typing-text">يكتب الآن...</span>
                    </div>
                </div>

                <!-- منطقة الإدخال -->
                <footer class="chat-input-area">
                    <div class="input-container">
                        <button class="btn-icon attach-btn" id="attachBtn">
                            <i class="fas fa-plus-circle"></i>
                        </button>
                        
                        <div class="input-wrapper">
                            <button class="btn-icon emoji-btn" id="emojiBtn">
                                <i class="far fa-smile"></i>
                            </button>
                            
                            <div class="text-input-container">
                                <textarea 
                                    id="messageInput" 
                                    placeholder="اكتب رسالتك..." 
                                    rows="1"
                                ></textarea>
                            </div>
                            
                            <button class="btn-icon voice-btn" id="voiceBtn">
                                <i class="fas fa-microphone"></i>
                            </button>
                        </div>

                        <button class="btn-send" id="sendBtn">
                            <i class="fas fa-paper-plane"></i>
                        </button>
                    </div>

                    <!-- قائمة المرفقات -->
                    <div class="attach-menu hidden" id="attachMenu">
                        <div class="attach-grid">
                            <button class="attach-item" data-type="image">
                                <div class="attach-icon" style="--color: #e91e63;">
                                    <i class="fas fa-image"></i>
                                </div>
                                <span>صورة</span>
                            </button>
                            <button class="attach-item" data-type="document">
                                <div class="attach-icon" style="--color: #4caf50;">
                                    <i class="fas fa-file-alt"></i>
                                </div>
                                <span>ملف</span>
                            </button>
                            <button class="attach-item" data-type="location">
                                <div class="attach-icon" style="--color: #f44336;">
                                    <i class="fas fa-map-marker-alt"></i>
                                </div>
                                <span>موقع</span>
                            </button>
                        </div>
                    </div>
                </footer>
            </div>
        </main>

        <!-- الإشعارات -->
        <div class="notifications-container" id="notificationsContainer"></div>
    </div>

    <!-- JavaScript Files -->
    <script src="js/app.js"></script>
</body>
</html>
