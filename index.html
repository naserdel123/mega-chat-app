<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <!-- منع التكبير نهائياً -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>MegaChat - تسجيل الدخول</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            /* منع التكبير على مستوى جميع العناصر */
            touch-action: pan-x pan-y;
            -webkit-text-size-adjust: none;
            -moz-text-size-adjust: none;
            -ms-text-size-adjust: none;
            text-size-adjust: none;
        }

        :root {
            --primary: #667eea;
            --secondary: #764ba2;
            --accent: #f093fb;
            --success: #4ade80;
            --error: #ef4444;
            --dark: #0a0a0f;
            --card-bg: rgba(255, 255, 255, 0.03);
            --scale: 1;
        }

        html {
            font-size: 16px;
            /* منع التكبير في المتصفحات */
            zoom: 1;
            -moz-transform: scale(1);
            -moz-transform-origin: 0 0;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background: var(--dark);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            /* منع جميع إيماءات التكبير */
            touch-action: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* منع التكبير بالكيبورد على الموبايل */
        input, textarea, select {
            font-size: 16px !important;
            touch-action: manipulation;
            -webkit-user-select: text;
            user-select: text;
        }

        /* خلفية متحركة أسطورية */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
            background: 
                radial-gradient(ellipse at 20% 80%, rgba(102, 126, 234, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(240, 147, 251, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 40% 40%, rgba(118, 75, 162, 0.1) 0%, transparent 50%);
            pointer-events: none;
        }

        .bg-animation span {
            position: absolute;
            display: block;
            width: 20px;
            height: 20px;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.4), rgba(240, 147, 251, 0.2));
            animation: float-up 25s linear infinite;
            bottom: -150px;
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(102, 126, 234, 0.3);
        }

        .bg-animation span:nth-child(1) { left: 25%; width: 80px; height: 80px; animation-delay: 0s; }
        .bg-animation span:nth-child(2) { left: 10%; width: 20px; height: 20px; animation-delay: 2s; animation-duration: 12s; }
        .bg-animation span:nth-child(3) { left: 70%; width: 20px; height: 20px; animation-delay: 4s; }
        .bg-animation span:nth-child(4) { left: 40%; width: 60px; height: 60px; animation-delay: 0s; animation-duration: 18s; }
        .bg-animation span:nth-child(5) { left: 65%; width: 20px; height: 20px; animation-delay: 0s; }
        .bg-animation span:nth-child(6) { left: 75%; width: 110px; height: 110px; animation-delay: 3s; }
        .bg-animation span:nth-child(7) { left: 35%; width: 150px; height: 150px; animation-delay: 7s; }
        .bg-animation span:nth-child(8) { left: 50%; width: 25px; height: 25px; animation-delay: 15s; animation-duration: 45s; }
        .bg-animation span:nth-child(9) { left: 20%; width: 15px; height: 15px; animation-delay: 2s; animation-duration: 35s; }
        .bg-animation span:nth-child(10) { left: 85%; width: 150px; height: 150px; animation-delay: 0s; animation-duration: 11s; }

        @keyframes float-up {
            0% {
                transform: translateY(0) rotate(0deg) scale(1);
                opacity: 1;
                border-radius: 0;
            }
            50% {
                transform: translateY(-500px) rotate(360deg) scale(1.2);
            }
            100% {
                transform: translateY(-1000px) rotate(720deg) scale(0.8);
                opacity: 0;
                border-radius: 50%;
            }
        }

        /* تأثيرات الإضاءة */
        .light-effect {
            position: absolute;
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, rgba(102, 126, 234, 0.3) 0%, transparent 70%);
            top: -400px;
            right: -400px;
            animation: pulse-light 10s ease-in-out infinite;
            filter: blur(80px);
            pointer-events: none;
        }

        .light-effect:nth-child(2) {
            background: radial-gradient(circle, rgba(240, 147, 251, 0.25) 0%, transparent 70%);
            bottom: -400px;
            left: -400px;
            top: auto;
            right: auto;
            animation-delay: 5s;
        }

        .light-effect:nth-child(3) {
            background: radial-gradient(circle, rgba(74, 222, 128, 0.2) 0%, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: rotate-light 20s linear infinite;
        }

        @keyframes pulse-light {
            0%, 100% { transform: scale(1) rotate(0deg); opacity: 0.4; }
            50% { transform: scale(1.3) rotate(180deg); opacity: 0.7; }
        }

        @keyframes rotate-light {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        /* الحاوية الرئيسية - مقفلة الحجم */
        .container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 480px;
            padding: 20px;
            perspective: 1000px;
            transform: scale(var(--scale));
            transform-origin: center center;
        }

        /* الشعار */
        .logo-container {
            text-align: center;
            margin-bottom: 40px;
            perspective: 1000px;
        }

        .logo-3d {
            width: 120px;
            height: 120px;
            margin: 0 auto 25px;
            position: relative;
            transform-style: preserve-3d;
            animation: logo-float 6s ease-in-out infinite;
            cursor: pointer;
        }

        .logo-3d:hover {
            animation-play-state: paused;
        }

        @keyframes logo-float {
            0%, 100% { transform: translateY(0) rotateY(0deg) rotateX(0deg); }
            25% { transform: translateY(-15px) rotateY(5deg) rotateX(5deg); }
            50% { transform: translateY(-25px) rotateY(0deg) rotateX(0deg); }
            75% { transform: translateY(-15px) rotateY(-5deg) rotateX(-5deg); }
        }

        .logo-ring {
            position: absolute;
            inset: 0;
            border: 3px solid transparent;
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 3s linear infinite;
            box-shadow: 0 0 20px rgba(102, 126, 234, 0.3);
        }

        .logo-ring:nth-child(2) {
            inset: 10px;
            border-top-color: var(--accent);
            animation-duration: 5s;
            animation-direction: reverse;
            border-right-color: rgba(240, 147, 251, 0.3);
        }

        .logo-ring:nth-child(3) {
            inset: 20px;
            border-top-color: var(--success);
            animation-duration: 7s;
            border-left-color: rgba(74, 222, 128, 0.3);
        }

        .logo-icon {
            position: absolute;
            inset: 30px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 45px;
            box-shadow: 
                0 0 60px rgba(102, 126, 234, 0.6),
                inset 0 0 20px rgba(255,255,255,0.2);
            animation: glow 2s ease-in-out infinite;
            transition: transform 0.3s ease;
        }

        .logo-3d:hover .logo-icon {
            transform: scale(1.1);
        }

        @keyframes glow {
            0%, 100% { 
                box-shadow: 
                    0 0 60px rgba(102, 126, 234, 0.6),
                    0 0 100px rgba(102, 126, 234, 0.3),
                    inset 0 0 20px rgba(255,255,255,0.2);
            }
            50% { 
                box-shadow: 
                    0 0 80px rgba(102, 126, 234, 0.9), 
                    0 0 140px rgba(240, 147, 251, 0.5),
                    inset 0 0 30px rgba(255,255,255,0.3);
            }
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .brand-name {
            font-size: 48px;
            font-weight: 900;
            background: linear-gradient(135deg, var(--primary), var(--accent), var(--success), var(--primary));
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradient-shift 4s ease infinite;
            letter-spacing: 3px;
            text-shadow: 0 0 30px rgba(102, 126, 234, 0.3);
        }

        @keyframes gradient-shift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .brand-tagline {
            color: #a0a0b0;
            font-size: 16px;
            margin-top: 10px;
            opacity: 0;
            animation: fade-in-up 1s ease 0.5s forwards;
            letter-spacing: 1px;
        }

        @keyframes fade-in-up {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* البطاقة */
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            padding: 40px;
            box-shadow: 
                0 25px 50px -12px rgba(0, 0, 0, 0.5),
                0 0 0 1px rgba(255, 255, 255, 0.05),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            transform: translateY(50px) rotateX(10deg);
            opacity: 0;
            animation: card-enter 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) 0.3s forwards;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px) rotateX(0deg);
            box-shadow: 
                0 30px 60px -12px rgba(0, 0, 0, 0.6),
                0 0 0 1px rgba(102, 126, 234, 0.2),
                0 0 40px rgba(102, 126, 234, 0.1);
        }

        @keyframes card-enter {
            to {
                transform: translateY(0) rotateX(0deg);
                opacity: 1;
            }
        }

        /* التبويبات */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            background: rgba(255, 255, 255, 0.05);
            padding: 6px;
            border-radius: 16px;
            position: relative;
        }

        .tab {
            flex: 1;
            padding: 14px;
            background: none;
            border: none;
            color: #a0a0b0;
            font-family: inherit;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            border-radius: 12px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            z-index: 1;
        }

        .tab::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            opacity: 0;
            transition: all 0.3s ease;
            border-radius: 12px;
            z-index: -1;
        }

        .tab:hover {
            color: white;
            transform: translateY(-2px);
        }

        .tab.active {
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
        }

        .tab.active::before {
            opacity: 1;
        }

        /* النماذج */
        .form {
            display: none;
        }

        .form.active {
            display: block;
            animation: form-fade 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes form-fade {
            from { opacity: 0; transform: translateX(30px) scale(0.95); }
            to { opacity: 1; transform: translateX(0) scale(1); }
        }

        .input-group {
            margin-bottom: 24px;
            position: relative;
        }

        .input-group label {
            display: block;
            color: #a0a0b0;
            font-size: 14px;
            margin-bottom: 10px;
            font-weight: 500;
            transition: all 0.3s ease;
            transform-origin: right;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: #6b7280;
            font-size: 18px;
            transition: all 0.3s ease;
            z-index: 2;
        }

        input {
            width: 100%;
            padding: 18px 50px 18px 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            color: white;
            font-family: inherit;
            font-size: 16px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(102, 126, 234, 0.08);
            box-shadow: 
                0 0 0 4px rgba(102, 126, 234, 0.1),
                0 0 20px rgba(102, 126, 234, 0.2);
            transform: translateY(-2px);
        }

        input:focus + .input-icon {
            color: var(--primary);
            transform: translateY(-50%) scale(1.1);
        }

        .input-group:focus-within label {
            color: var(--primary);
            transform: translateX(-5px) scale(1.05);
        }

        /* زر الإظهار/الإخفاء */
        .toggle-password {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #6b7280;
            cursor: pointer;
            font-size: 16px;
            padding: 8px;
            transition: all 0.3s ease;
            border-radius: 8px;
            z-index: 2;
        }

        .toggle-password:hover {
            color: var(--primary);
            background: rgba(102, 126, 234, 0.1);
            transform: translateY(-50%) scale(1.1);
        }

        /* زر الدخول */
        .btn-submit {
            width: 100%;
            padding: 20px;
            margin-top: 15px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            background-size: 200% 200%;
            border: none;
            border-radius: 16px;
            color: white;
            font-family: inherit;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 
                0 10px 30px rgba(102, 126, 234, 0.3),
                0 0 0 1px rgba(255,255,255,0.1) inset;
        }

        .btn-submit::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transition: left 0.6s ease;
        }

        .btn-submit:hover::before {
            left: 100%;
        }

        .btn-submit:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 
                0 20px 40px rgba(102, 126, 234, 0.4),
                0 0 0 1px rgba(255,255,255,0.2) inset;
            animation: gradient-shift 2s ease infinite;
        }

        .btn-submit:active {
            transform: translateY(-1px) scale(0.98);
        }

        .btn-submit.loading {
            pointer-events: none;
            color: transparent;
        }

        .btn-submit.loading::after {
            content: '';
            position: absolute;
            width: 24px;
            height: 24px;
            border: 3px solid transparent;
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            left: 50%;
            top: 50%;
            margin: -12px 0 0 -12px;
        }

        /* رابط نسيان كلمة المرور */
        .forgot-link {
            text-align: center;
            margin-top: 25px;
        }

        .forgot-link a {
            color: var(--primary);
            text-decoration: none;
            font-size: 14px;
            position: relative;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .forgot-link a::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            transition: width 0.3s ease;
        }

        .forgot-link a:hover {
            color: var(--accent);
        }

        .forgot-link a:hover::after {
            width: 100%;
        }

        /* الرسائل */
        .message {
            padding: 14px 18px;
            border-radius: 14px;
            font-size: 14px;
            margin-bottom: 20px;
            display: none;
            align-items: center;
            gap: 12px;
            animation: slide-in 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid;
        }

        .message.show {
            display: flex;
        }

        .message.error {
            background: rgba(239, 68, 68, 0.1);
            border-color: rgba(239, 68, 68, 0.3);
            color: #ef4444;
        }

        .message.success {
            background: rgba(74, 222, 128, 0.1);
            border-color: rgba(74, 222, 128, 0.3);
            color: #4ade80;
        }

        @keyframes slide-in {
            from { 
                opacity: 0; 
                transform: translateY(-20px) scale(0.95); 
            }
            to { 
                opacity: 1; 
                transform: translateY(0) scale(1); 
            }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-10
