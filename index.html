<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MegaChat</title>
    
    <!-- CSS -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* CSS مدمج للسرعة */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Tajawal', sans-serif;
            background: #0f0f1a;
            color: white;
            overflow: hidden;
            height: 100vh;
        }

        /* Preloader بسيط */
        .preloader {
            position: fixed;
            inset: 0;
            background: #0f0f1a;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.3s ease;
        }

        .preloader.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loader {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(102, 126, 234, 0.3);
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* باقي الأنماط... */
        .app { display: flex; height: 100vh; opacity: 0; transition: opacity 0.3s ease; }
        .app.visible { opacity: 1; }
        
        .sidebar {
            width: 350px;
            background: #1a1a2e;
            border-left: 1px solid rgba(255,255,255,0.1);
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .user-card {
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .user-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 3px solid #667eea;
        }

        .search-box {
            padding: 15px 20px;
        }

        .search-box input {
            width: 100%;
            padding: 12px 15px;
            background: #252542;
            border: none;
            border-radius: 25px;
            color: white;
            font-family: inherit;
        }

        .conversations-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .conversation-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: 5px;
        }

        .conversation-item:hover, .conversation-item.active {
            background: #252542;
        }

        .conversation-item img {
            width: 50px;
            height: 50px;
            border-radius: 50%;
        }

        .conversation-info { flex: 1; }
        .conversation-name { font-weight: 600; margin-bottom: 5px; }
        .conversation-message {
            font-size: 14px;
            color: #a0a0b0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #0f0f1a;
        }

        .chat-header {
            padding: 20px;
            background: #1a1a2e;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .chat-user {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .chat-user img {
            width: 45px;
            height: 45px;
            border-radius: 50%;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 70%;
            padding: 15px 20px;
            border-radius: 20px;
            animation: messagePop 0.3s ease;
        }

        @keyframes messagePop {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.9);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .message.sent {
            align-self: flex-end;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-bottom-right-radius: 5px;
        }

        .message.received {
            align-self: flex-start;
            background: #252542;
            border-bottom-left-radius: 5px;
        }

        .message-time {
            font-size: 12px;
            opacity: 0.7;
            margin-top: 5px;
        }

        .chat-input {
            padding: 20px;
            background: #1a1a2e;
            border-top: 1px solid rgba(255,255,255,0.1);
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .chat-input input {
            flex: 1;
            padding: 15px 20px;
            background: #252542;
            border: none;
            border-radius: 25px;
            color: white;
            font-family: inherit;
            font-size: 15px;
        }

        .btn-send {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            color: white;
            cursor: pointer;
            font-size: 18px;
            transition: transform 0.2s ease;
        }

        .btn-send:hover {
            transform: scale(1.1);
        }

        .empty-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #a0a0b0;
        }

        .empty-state i {
            font-size: 80px;
            margin-bottom: 20px;
            opacity: 0.3;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>
    <!-- تحقق سريع من تسجيل الدخول -->
    <script>
        if (localStorage.getItem('megachat_logged_in') !== 'true') {
            window.location.replace('login.html');
        }
    </script>

    <!-- Preloader -->
    <div class="preloader" id="preloader">
        <div class="loader"></div>
    </div>

    <!-- التطبيق -->
    <div class="app" id="app">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="brand">
                    <i class="fas fa-comments"></i>
                    <span>MegaChat</span>
                </div>
            </div>

            <div class="user-card">
                <img src="https://i.pravatar.cc/150?img=11" alt="User" class="user-avatar" id="userAvatar">
                <div>
                    <div style="font-weight: 600;" id="userName">أحمد محمد</div>
                    <div style="font-size: 13px; color: #4ade80;">● متصل</div>
                </div>
            </div>

            <div class="search-box">
                <input type="text" placeholder="بحث..." id="searchInput">
            </div>

            <div class="conversations-list" id="conversationsList"></div>
        </aside>

        <!-- Chat Area -->
        <main class="chat-area">
            <div class="empty-state" id="emptyState">
                <i class="fas fa-comments"></i>
                <h2>اختر محادثة</h2>
                <p>اختر جهة اتصال من القائمة</p>
            </div>

            <div id="chatInterface" class="hidden" style="display: flex; flex-direction: column; height: 100%;">
                <div class="chat-header">
                    <div class="chat-user">
                        <img src="" alt="" id="chatAvatar">
                        <div>
                            <div style="font-weight: 600;" id="chatName"></div>
                            <div style="font-size: 13px; color: #a0a0b0;" id="chatStatus"></div>
                        </div>
                    </div>
                    <button onclick="logout()" style="background: none; border: none; color: #ef4444; cursor: pointer;">
                        <i class="fas fa-sign-out-alt"></i>
                    </button>
                </div>

                <div class="messages-container" id="messagesList"></div>

                <div class="chat-input">
                    <input type="text" placeholder="اكتب رسالتك..." id="messageInput">
                    <button class="btn-send" onclick="sendMessage()">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
            </div>
        </main>
    </div>

    <script>
        // بيانات المحادثات
        const conversations = [
            {
                id: 1,
                name: "سارة أحمد",
                avatar: "https://i.pravatar.cc/150?img=5",
                status: "متصل الآن",
                messages: [
                    { text: "مرحبا سارة!", sent: true, time: "10:30" },
                    { text: "أهلاً أحمد", sent: false, time: "10:31" },
                    { text: "كيف حالك؟", sent: true, time: "10:32" },
                    { text: "بخير الحمدلله", sent: false, time: "10:33" }
                ]
            },
            {
                id: 2,
                name: "محمد علي",
                avatar: "https://i.pravatar.cc/150?img=3",
                status: "غائب",
                messages: [
                    { text: "هل انتهيت من العمل؟", sent: true, time: "09:00" },
                    { text: "نعم، تم الانتهاء", sent: false, time: "09:15" }
                ]
            },
            {
                id: 3,
                name: "فاطمة حسن",
                avatar: "https://i.pravatar.cc/150?img=9",
                status: "غير متصل",
                messages: [
                    { text: "شكراً جزيلاً", sent: false, time: "أمس" }
                ]
            }
        ];

        let currentChat = null;

        // تحميل المستخدم
        function loadUser() {
            const user = JSON.parse(localStorage.getItem('megachat_user') || '{}');
            if (user.name) {
                document.getElementById('userName').textContent = user.name;
                document.getElementById('userAvatar').src = user.avatar || 'https://i.pravatar.cc/150?img=11';
            }
        }

        // عرض المحادثات
        function renderConversations() {
            const list = document.getElementById('conversationsList');
            list.innerHTML = '';

            conversations.forEach((conv, index) => {
                const lastMsg = conv.messages[conv.messages.length - 1];
                const item = document.createElement('div');
                item.className = 'conversation-item';
                item.innerHTML = `
                    <img src="${conv.avatar}" alt="${conv.name}">
                    <div class="conversation-info">
                        <div class="conversation-name">${conv.name}</div>
                        <div class="conversation-message">${lastMsg.text}</div>
                    </div>
                `;
                item.onclick = () => openChat(index);
                list.appendChild(item);
            });
        }

        // فتح محادثة
        function openChat(index) {
            currentChat = conversations[index];
            
            document.getElementById('emptyState').classList.add('hidden');
            document.getElementById('chatInterface').classList.remove('hidden');
            
            document.getElementById('chatAvatar').src = currentChat.avatar;
            document.getElementById('chatName').textContent = currentChat.name;
            document.getElementById('chatStatus').textContent = currentChat.status;

            renderMessages();
            
            // تحديث النشط
            document.querySelectorAll('.conversation-item').forEach((el, i) => {
                el.classList.toggle('active', i === index);
            });
        }

        // عرض الرسائل
        function renderMessages() {
            const container = document.getElementById('messagesList');
            container.innerHTML = '';

            currentChat.messages.forEach(msg => {
                const div = document.createElement('div');
                div.className = `message ${msg.sent ? 'sent' : 'received'}`;
                div.innerHTML = `
                    <div>${msg.text}</div>
                    <div class="message-time">${msg.time}</div>
                `;
                container.appendChild(div);
            });

            container.scrollTop = container.scrollHeight;
        }

        // إرسال رسالة
        function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            
            if (!text || !currentChat) return;

            const now = new Date();
            const time = now.getHours().toString().padStart(2, '0') + ':' + 
                        now.getMinutes().toString().padStart(2, '0');

            currentChat.messages.push({
                text: text,
                sent: true,
                time: time
            });

            input.value = '';
            renderMessages();

            // رد تلقائي
            setTimeout(() => {
                const replies = ["ممتاز!", "تمام", "حاضر", "شكراً"];
                currentChat.messages.push({
                    text: replies[Math.floor(Math.random() * replies.length)],
                    sent: false,
                    time: time
                });
                renderMessages();
            }, 1000);
        }

        // تسجيل خروج
        function logout() {
            localStorage.removeItem('megachat_logged_in');
            localStorage.removeItem('megachat_user');
            window.location.replace('login.html');
        }

        // بحث
        document.getElementById('searchInput')?.addEventListener('input', function() {
            const query = this.value.toLowerCase();
            document.querySelectorAll('.conversation-item').forEach((el, i) => {
                el.style.display = conversations[i].name.toLowerCase().includes(query) ? 'flex' : 'none';
            });
        });

        // Enter لإرسال
        document.getElementById('messageInput')?.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') sendMessage();
        });

        // بدء التطبيق
        window.onload = function() {
            loadUser();
            renderConversations();
            
            // إخفاء preloader
            setTimeout(() => {
                document.getElementById('preloader').classList.add('hidden');
                document.getElementById('app').classList.add('visible');
            }, 300);
        };
    </script>
</body>
  </html>
