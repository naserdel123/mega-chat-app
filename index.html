<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MegaChat Pro - تطبيق المراسلة المتكامل</title>
    
    <!-- CSS Files -->
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/themes.css">
    <link rel="stylesheet" href="css/responsive.css">
    
    <!-- External Libraries -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/emoji-picker-element@1.12.0/dist/emoji-picker-element.css">
    
    <!-- Meta Tags -->
    <meta name="description" content="تطبيق مراسلة فائق السرعة مع مميزات متقدمة">
    <meta name="theme-color" content="#667eea">
    <link rel="manifest" href="manifest.json">
</head>
<body data-theme="dark">
    <!-- شاشة التحميل المتقدمة -->
    <div id="preloader" class="preloader">
        <div class="preloader-content">
            <div class="logo-3d">
                <div class="cube">
                    <div class="face front"></div>
                    <div class="face back"></div>
                    <div class="face right"></div>
                    <div class="face left"></div>
                    <div class="face top"></div>
                    <div class="face bottom"></div>
                </div>
            </div>
            <h1 class="loading-text">MegaChat Pro</h1>
            <div class="progress-container">
                <div class="progress-bar" id="progressBar"></div>
                <span class="progress-text" id="progressText">0%</span>
            </div>
            <div class="loading-status" id="loadingStatus">جاري التحميل...</div>
        </div>
    </div>

    <!-- التطبيق الرئيسي -->
    <div id="app" class="app hidden">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="brand">
                    <div class="logo-icon">
                        <i class="fas fa-comments"></i>
                    </div>
                    <span class="brand-name">MegaChat</span>
                </div>
                <button class="btn-icon" id="sidebarToggle">
                    <i class="fas fa-bars"></i>
                </button>
            </div>

            <!-- قائمة المستخدم -->
            <div class="user-card">
                <div class="user-avatar-container">
                    <img src="https://i.pravatar.cc/150?img=11" alt="User" class="user-avatar" id="currentUserAvatar">
                    <div class="status-ring online"></div>
                    <div class="story-ring" data-has-story="true"></div>
                </div>
                <div class="user-info">
                    <h3 id="currentUserName">أحمد محمد</h3>
                    <p class="user-status" id="currentUserStatus">متصل الآن</p>
                </div>
                <button class="btn-icon dropdown-toggle" id="userMenuBtn">
                    <i class="fas fa-ellipsis-v"></i>
                </button>
                
                <!-- قائمة منسدلة -->
                <div class="dropdown-menu" id="userDropdown">
                    <a href="profile.html" class="dropdown-item">
                        <i class="fas fa-user"></i>
                        <span>الملف الشخصي</span>
                    </a>
                    <a href="settings.html" class="dropdown-item">
                        <i class="fas fa-cog"></i>
                        <span>الإعدادات</span>
                    </a>
                    <div class="dropdown-divider"></div>
                    <a href="#" class="dropdown-item text-danger" id="logoutBtn">
                        <i class="fas fa-sign-out-alt"></i>
                        <span>تسجيل الخروج</span>
                    </a>
                </div>
            </div>

            <!-- صندوق البحث المتقدم -->
            <div class="search-section">
                <div class="search-box">
                    <i class="fas fa-search search-icon"></i>
                    <input type="text" placeholder="بحث في المحادثات والرسائل..." id="globalSearch">
                    <button class="btn-icon search-filter" id="searchFilter">
                        <i class="fas fa-sliders-h"></i>
                    </button>
                </div>
                
                <!-- فلاتر البحث -->
                <div class="search-filters hidden" id="searchFilters">
                    <label class="filter-chip active" data-filter="all">
                        <i class="fas fa-th-large"></i> الكل
                    </label>
                    <label class="filter-chip" data-filter="unread">
                        <i class="fas fa-envelope"></i> غير مقروء
                    </label>
                    <label class="filter-chip" data-filter="groups">
                        <i class="fas fa-users"></i> مجموعات
                    </label>
                    <label class="filter-chip" data-filter="media">
                        <i class="fas fa-image"></i> ميديا
                    </label>
                </div>
            </div>

            <!-- تبويبات المحادثات -->
            <div class="tabs-container">
                <div class="tabs-header">
                    <button class="tab-btn active" data-tab="chats">
                        <i class="fas fa-comment"></i>
                        <span>المحادثات</span>
                        <span class="badge" id="chatsBadge">3</span>
                    </button>
                    <button class="tab-btn" data-tab="groups">
                        <i class="fas fa-users"></i>
                        <span>المجموعات</span>
                    </button>
                    <button class="tab-btn" data-tab="calls">
                        <i class="fas fa-phone"></i>
                        <span>المكالمات</span>
                    </button>
                </div>

                <!-- قائمة المحادثات -->
                <div class="tab-content active" id="chatsTab">
                    <div class="conversations-list" id="conversationsList">
                        <!-- تُملأ ديناميكياً -->
                    </div>
                </div>

                <!-- المجموعات -->
                <div class="tab-content" id="groupsTab">
                    <div class="groups-list" id="groupsList"></div>
                </div>

                <!-- المكالمات -->
                <div class="tab-content" id="callsTab">
                    <div class="calls-list" id="callsList"></div>
                </div>
            </div>

            <!-- زر محادثة جديدة -->
            <button class="fab-btn" id="newChatBtn">
                <i class="fas fa-plus"></i>
                <span class="fab-tooltip">محادثة جديدة</span>
            </button>
        </aside>

        <!-- منطقة الدردشة الرئيسية -->
        <main class="chat-area" id="chatArea">
            <!-- حالة فارغة -->
            <div class="empty-state" id="emptyState">
                <div class="empty-illustration">
                    <div class="floating-icons">
                        <i class="fas fa-comment-alt"></i>
                        <i class="fas fa-heart"></i>
                        <i class="fas fa-paper-plane"></i>
                    </div>
                </div>
                <h2>اختر محادثة للبدء</h2>
                <p>اختر جهة اتصال من القائمة الجانبية لبدء المحادثة</p>
                <button class="btn-primary" onclick="document.getElementById('newChatBtn').click()">
                    <i class="fas fa-plus"></i> محادثة جديدة
                </button>
            </div>

            <!-- واجهة الدردشة -->
            <div class="chat-interface hidden" id="chatInterface">
                <!-- Header -->
                <header class="chat-header">
                    <div class="chat-header-info">
                        <button class="btn-icon mobile-back" id="mobileBack">
                            <i class="fas fa-arrow-right"></i>
                        </button>
                        
                        <div class="chat-user-info" id="chatUserInfo">
                            <div class="avatar-container">
                                <img src="" alt="" class="chat-avatar" id="chatAvatar">
                                <div class="status-indicator" id="chatStatus"></div>
                            </div>
                            <div class="chat-meta">
                                <h3 id="chatName"></h3>
                                <span class="chat-status-text" id="chatStatusText"></span>
                            </div>
                        </div>
                    </div>

                    <div class="chat-header-actions">
                        <button class="btn-icon" id="searchInChat">
                            <i class="fas fa-search"></i>
                        </button>
                        <button class="btn-icon" id="voiceCallBtn">
                            <i class="fas fa-phone"></i>
                        </button>
                        <button class="btn-icon" id="videoCallBtn">
                            <i class="fas fa-video"></i>
                        </button>
                        <button class="btn-icon" id="chatInfoBtn">
                            <i class="fas fa-info-circle"></i>
                        </button>
                        <button class="btn-icon dropdown-toggle" id="chatMenuBtn">
                            <i class="fas fa-ellipsis-v"></i>
                        </button>
                    </div>
                </header>

                <!-- منطقة الرسائل -->
                <div class="messages-container" id="messagesContainer">
                    <!-- تاريخ المحادثة -->
                    <div class="chat-date-divider">
                        <span>اليوم</span>
                    </div>
                    
                    <!-- الرسائل تُضاف هنا -->
                    <div class="messages-list" id="messagesList"></div>
                    
                    <!-- مؤشر الكتابة -->
                    <div class="typing-indicator hidden" id="typingIndicator">
                        <div class="typing-bubble">
                            <span></span>
                            <span></span>
                            <span></span>
                        </div>
                        <span class="typing-text">يكتب الآن...</span>
                    </div>
                    
                    <!-- التمرير السفلي -->
                    <div class="scroll-to-bottom hidden" id="scrollToBottom">
                        <button class="btn-icon">
                            <i class="fas fa-chevron-down"></i>
                            <span class="new-messages-badge" id="newMessagesBadge">3</span>
                        </button>
                    </div>
                </div>

                <!-- معلومات المستخدم الجانبية -->
                <div class="user-sidebar hidden" id="userSidebar">
                    <div class="user-sidebar-header">
                        <button class="btn-icon" id="closeUserSidebar">
                            <i class="fas fa-times"></i>
                        </button>
                        <h3>معلومات جهة الاتصال</h3>
                    </div>
                    <div class="user-sidebar-content" id="userSidebarContent">
                        <!-- تُملأ ديناميكياً -->
                    </div>
                </div>

                <!-- منطقة الإدخال -->
                <footer class="chat-input-area">
                    <!-- أدوات سريعة -->
                    <div class="quick-actions" id="quickActions">
                        <button class="quick-btn" data-action="location">
                            <i class="fas fa-map-marker-alt"></i>
                        </button>
                        <button class="quick-btn" data-action="contact">
                            <i class="fas fa-address-card"></i>
                        </button>
                        <button class="quick-btn" data-action="poll">
                            <i class="fas fa-poll"></i>
                        </button>
                    </div>

                    <!-- صندوق الإدخال الرئيسي -->
                    <div class="input-container">
                        <button class="btn-icon attach-btn" id="attachBtn">
                            <i class="fas fa-plus-circle"></i>
                        </button>
                        
                        <div class="input-wrapper">
                            <button class="btn-icon emoji-btn" id="emojiBtn">
                                <i class="far fa-smile"></i>
                            </button>
                            
                            <div class="text-input-container">
                                <textarea 
                                    id="messageInput" 
                                    placeholder="اكتب رسالتك هنا..." 
                                    rows="1"
                                    maxlength="5000"
                                ></textarea>
                                <span class="char-count" id="charCount">0/5000</span>
                            </div>
                            
                            <button class="btn-icon voice-btn" id="voiceBtn">
                                <i class="fas fa-microphone"></i>
                            </button>
                        </div>

                        <button class="btn-send" id="sendBtn">
                            <i class="fas fa-paper-plane"></i>
                        </button>
                    </div>

                    <!-- قائمة المرفقات -->
                    <div class="attach-menu hidden" id="attachMenu">
                        <div class="attach-grid">
                            <button class="attach-item" data-type="image">
                                <div class="attach-icon" style="--color: #e91e63;">
                                    <i class="fas fa-image"></i>
                                </div>
                                <span>صورة</span>
                            </button>
                            <button class="attach-item" data-type="camera">
                                <div class="attach-icon" style="--color: #ff9800;">
                                    <i class="fas fa-camera"></i>
                                </div>
                                <span>كاميرا</span>
                            </button>
                            <button class="attach-item" data-type="document">
                                <div class="attach-icon" style="--color: #4caf50;">
                                    <i class="fas fa-file-alt"></i>
                                </div>
                                <span>ملف</span>
                            </button>
                            <button class="attach-item" data-type="audio">
                                <div class="attach-icon" style="--color: #9c27b0;">
                                    <i class="fas fa-music"></i>
                                </div>
                                <span>صوت</span>
                            </button>
                            <button class="attach-item" data-type="location">
                                <div class="attach-icon" style="--color: #f44336;">
                                    <i class="fas fa-map-marker-alt"></i>
                                </div>
                                <span>موقع</span>
                            </button>
                            <button class="attach-item" data-type="contact">
                                <div class="attach-icon" style="--color: #2196f3;">
                                    <i class="fas fa-user"></i>
                                </div>
                                <span>جهة اتصال</span>
                            </button>
                        </div>
                    </div>

                    <!-- مسجل الصوت -->
                    <div class="voice-recorder hidden" id="voiceRecorder">
                        <div class="recorder-wave">
                            <canvas id="waveCanvas"></canvas>
                        </div>
                        <div class="recorder-controls">
                            <button class="btn-icon delete" id="cancelRecording">
                                <i class="fas fa-trash"></i>
                            </button>
                            <div class="recording-time" id="recordingTime">00:00</div>
                            <button class="btn-icon send" id="sendVoice">
                                <i class="fas fa-check"></i>
                            </button>
                        </div>
                    </div>
                </footer>
            </div>
        </main>

        <!-- الإشعارات -->
        <div class="notifications-container" id="notificationsContainer"></div>

        <!-- Modal عام -->
        <div class="modal-overlay hidden" id="modalOverlay">
            <div class="modal-content" id="modalContent">
                <!-- تُملأ ديناميكياً -->
            </div>
        </div>
    </div>

    <!-- JavaScript Files -->
    <script src="js/storage.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/notifications.js"></script>
    <script src="js/voice.js"></script>
    <script src="js/fileSharing.js"></script>
    <script src="js/emoji.js"></script>
    <script src="js/chat.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
