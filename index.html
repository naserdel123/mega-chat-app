<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MegaChat</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #667eea;
            --secondary: #764ba2;
            --accent: #f093fb;
            --success: #4ade80;
            --danger: #ef4444;
            --bg-dark: #0a0a0f;
            --bg-card: #151520;
            --bg-hover: #1f1f2e;
            --text-primary: #ffffff;
            --text-secondary: #a0a0b0;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            overflow: hidden;
            height: 100vh;
        }

        /* Preloader أسطوري */
        .preloader {
            position: fixed;
            inset: 0;
            background: var(--bg-dark);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            transition: all 0.8s cubic-bezier(0.7, 0, 0.3, 1);
        }

        .preloader.hidden {
            opacity: 0;
            pointer-events: none;
            transform: scale(1.1);
        }

        .loader-ring {
            position: relative;
            width: 150px;
            height: 150px;
        }

        .loader-ring svg {
            position: absolute;
            inset: 0;
            transform: rotate(-90deg);
        }

        .loader-ring circle {
            fill: none;
            stroke-width: 4;
        }

        .loader-ring .bg {
            stroke: rgba(102, 126, 234, 0.1);
        }

        .loader-ring .progress {
            stroke: url(#gradient);
            stroke-linecap: round;
            stroke-dasharray: 440;
            stroke-dashoffset: 440;
            animation: fill-ring 2s ease-in-out forwards;
        }

        @keyframes fill-ring {
            to { stroke-dashoffset: 0; }
        }

        .loader-text {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            font-weight: 900;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .loader-subtext {
            margin-top: 30px;
            font-size: 14px;
            color: var(--text-secondary);
            letter-spacing: 3px;
            animation: pulse 2s infinite;
        }

        /* التطبيق */
        .app {
            display: flex;
            height: 100vh;
            opacity: 0;
            transform: scale(0.95);
            transition: all 0.5s ease;
        }

        .app.visible {
            opacity: 1;
            transform: scale(1);
        }

        /* Sidebar */
        .sidebar {
            width: 380px;
            background: var(--bg-card);
            border-left: 1px solid rgba(255,255,255,0.05);
            display: flex;
            flex-direction: column;
            position: relative;
            transform: translateX(0);
            transition: transform 0.3s ease;
        }

        .sidebar-header {
            padding: 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand i {
            font-size: 32px;
            -webkit-text-fill-color: initial;
            color: var(--primary);
        }

        .user-card {
            padding: 25px;
            display: flex;
            align-items: center;
            gap: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            position: relative;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .user-card:hover {
            background: rgba(102, 126, 234, 0.05);
        }

        .user-avatar {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            border: 3px solid transparent;
            background: linear-gradient(135deg, var(--primary), var(--secondary)) padding-box,
                        linear-gradient(135deg, var(--primary), var(--accent)) border-box;
            padding: 2px;
            transition: all 0.3s ease;
        }

        .user-avatar:hover {
            transform: scale(1.05) rotate(5deg);
        }

        .user-avatar img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .user-info h3 {
            font-size: 16px;
            margin-bottom: 4px;
        }

        .user-status {
            font-size: 13px;
            color: var(--success);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .user-status::before {
            content: '';
            width: 8px;
            height: 8px;
            background: var(--success);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--success);
            animation: pulse 2s infinite;
        }

        /* البحث */
        .search-box {
            padding: 20px 25px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 15px 20px 15px 50px;
            background: var(--bg-hover);
            border: 2px solid transparent;
            border-radius: 16px;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 15px;
            transition: all 0.3s ease;
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 20px rgba(102, 126, 234, 0.2);
        }

        .search-box i {
            position: absolute;
            left: 45px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            transition: all 0.3s ease;
        }

        .search-box input:focus + i {
            color: var(--primary);
            transform: translateY(-50%) scale(1.1);
        }

        /* أزرار الإجراءات */
        .action-buttons {
            display: flex;
            gap: 10px;
            padding: 0 25px 20px;
        }

        .btn-action {
            flex: 1;
            padding: 12px;
            background: var(--bg-hover);
            border: none;
            border-radius: 12px;
            color: var(--text-secondary);
            font-family: inherit;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .btn-action:hover {
            background: var(--primary);
            color: white;
            transform: translateY(-2px);
        }

        .btn-action i {
            font-size: 16px;
        }

        /* قائمة المحادثات */
        .conversations-list {
            flex: 1;
            overflow-y: auto;
            padding: 0 15px;
        }

        .conversation-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 8px;
            position: relative;
            overflow: hidden;
        }

        .conversation-item::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, var(--primary), transparent);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .conversation-item:hover::before,
        .conversation-item.active::before {
            opacity: 0.1;
        }

        .conversation-item:hover,
        .conversation-item.active {
            background: var(--bg-hover);
            transform: translateX(-5px);
        }

        .conversation-avatar {
            position: relative;
            width: 55px;
            height: 55px;
            flex-shrink: 0;
        }

        .conversation-avatar img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid transparent;
            transition: all 0.3s ease;
        }

        .conversation-item:hover .conversation-avatar img {
            border-color: var(--primary);
            transform: scale(1.05);
        }

        .status-dot {
            position: absolute;
            bottom: 3px;
            right: 3px;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 3px solid var(--bg-card);
        }

        .status-dot.online {
            background: var(--success);
            box-shadow: 0 0 10px var(--success);
        }

        .status-dot.offline {
            background: var(--text-secondary);
        }

        .conversation-info {
            flex: 1;
            min-width: 0;
            position: relative;
            z-index: 1;
        }

        .conversation-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .conversation-name {
            font-weight: 700;
            font-size: 15px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .conversation-time {
            font-size: 12px;
            color: var(--text-secondary);
            white-space: nowrap;
        }

        .conversation-preview {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .conversation-message {
            font-size: 14px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }

        .conversation-message.unread {
            color: var(--text-primary);
            font-weight: 500;
        }

        .unread-badge {
            background: var(--primary);
            color: white;
            font-size: 12px;
            min-width: 22px;
            height: 22px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            animation: badge-pulse 2s infinite;
        }

        @keyframes badge-pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        /* منطقة الدردشة */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-dark);
            position: relative;
        }

        .chat-header {
            padding: 20px 30px;
            background: rgba(21, 21, 32, 0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 10;
        }

        .chat-user-info {
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            padding: 8px;
            border-radius: 16px;
            transition: all 0.3s ease;
        }

        .chat-user-info:hover {
            background: rgba(255,255,255,0.05);
        }

        .chat-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            position: relative;
        }

        .chat-avatar img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .chat-meta h3 {
            font-size: 17px;
            margin-bottom: 4px;
        }

        .chat-status {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .chat-actions {
            display: flex;
            gap: 10px;
        }

        .btn-icon {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: rgba(255,255,255,0.05);
            border: none;
            color: var(--text-secondary);
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn-icon::before {
            content: '';
            position: absolute;
            inset: 0;
            background: var(--primary);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .btn-icon i {
            position: relative;
            z-index: 1;
        }

        .btn-icon:hover {
            color: white;
            transform: translateY(-3px);
        }

        .btn-icon:hover::before {
            opacity: 1;
        }

        /* الرسائل */
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            background-image: 
                radial-gradient(circle at 20% 50%, rgba(102, 126, 234, 0.03) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(240, 147, 251, 0.03) 0%, transparent 50%);
        }

        .message-date {
            text-align: center;
            color: var(--text-secondary);
            font-size: 13px;
            margin: 20px 0;
            position: relative;
        }

        .message-date::before,
        .message-date::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 100px;
            height: 1px;
            background: rgba(255,255,255,0.1);
        }

        .message-date::before { right: calc(50% + 60px); }
        .message-date::after { left: calc(50% + 60px); }

        .message {
            max-width: 70%;
            padding: 18px 22px;
            border-radius: 24px;
            position: relative;
            animation: message-pop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            word-wrap: break-word;
            line-height: 1.6;
        }

        @keyframes message-pop {
            0% {
                opacity: 0;
                transform: scale(0.8) translateY(20px);
            }
            70% {
                transform: scale(1.02) translateY(-5px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .message.sent {
            align-self: flex-end;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-bottom-right-radius: 6px;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
        }

        .message.received {
            align-self: flex-start;
            background: var(--bg-hover);
            border-bottom-left-radius: 6px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }

        .message-content {
            font-size: 15px;
            margin-bottom: 8px;
        }

        .message-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            opacity: 0.8;
        }

        .message.sent .message-meta {
            color: rgba(255,255,255,0.9);
            justify-content: flex-end;
        }

        .message.received .message-meta {
            color: var(--text-secondary);
        }

        .message-status {
            display: flex;
            gap: 2px;
        }

        .message-status.read {
            color: #a3e635;
        }

        /* مؤشر الكتابة */
        .typing-indicator {
            align-self: flex-start;
            display: none;
            align-items: center;
            gap: 12px;
            padding: 20px 25px;
            background: var(--bg-hover);
            border-radius: 24px;
            border-bottom-left-radius: 6px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }

        .typing-indicator.active {
            display: flex;
            animation: slide-up 0.3s ease;
        }

        @keyframes slide-up {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .typing-dots {
            display: flex;
            gap: 6px;
        }

        .typing-dots span {
            width: 10px;
            height: 10px;
            background: var(--primary);
            border-radius: 50%;
            animation: typing-bounce 1.4s infinite ease-in-out both;
        }

        .typing-dots span:nth-child(1) { animation-delay: -0.32s; }
        .typing-dots span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes typing-bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        .typing-text {
            font-size: 14px;
            color: var(--text-secondary);
        }

        /* منطقة الإدخال */
        .input-area {
            padding: 25px 30px;
            background: rgba(21, 21, 32, 0.8);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255,255,255,0.05);
            display: flex;
            gap: 15px;
            align-items: flex-end;
        }

        .input-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--bg-hover);
            border-radius: 30px;
            padding: 8px 8px 8px 20px;
            border: 2px solid transparent;
            transition: all 0.3s ease;
        }

        .input-wrapper:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 20px rgba(102, 126, 234, 0.2);
        }

        .btn-attach {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-attach:hover {
            color: var(--primary);
            transform: rotate(45deg) scale(1.1);
        }

        .message-input {
            flex: 1;
            background: none;
            border: none;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 15px;
            padding: 10px;
            resize: none;
            max-height: 120px;
            min-height: 24px;
        }

        .message-input:focus {
