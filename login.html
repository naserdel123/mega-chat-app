<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - MegaChat</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 50%, #252542 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            overflow: hidden;
        }

        .auth-box {
            background: rgba(26, 26, 46, 0.95);
            padding: 48px;
            border-radius: 24px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            font-size: 36px;
            box-shadow: 0 10px 40px rgba(102, 126, 234, 0.4);
        }

        h1 {
            font-size: 28px;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #667eea, #f093fb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: #a0a0b0;
            margin-bottom: 32px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: right;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #a0a0b0;
            font-size: 14px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #6b7280;
        }

        input {
            width: 100%;
            padding: 14px 16px 14px 48px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: white;
            font-family: inherit;
            font-size: 15px;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
            background: rgba(102, 126, 234, 0.05);
        }

        input::placeholder {
            color: #6b7280;
        }

        .btn-login {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .divider {
            margin: 24px 0;
            position: relative;
            color: #6b7280;
            font-size: 13px;
        }

        .divider::before,
        .divider::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 80px;
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
        }

        .divider::before {
            right: 0;
        }

        .divider::after {
            left: 0;
        }

        .social-login {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .btn-social {
            flex: 1;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 18px;
        }

        .btn-social:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }

        .register-link {
            margin-top: 24px;
            color: #a0a0b0;
            font-size: 14px;
        }

        .register-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .error-message {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #ef4444;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }

        .error-message.show {
            display: block;
            animation: shake 0.5s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
    </style>
</head>
<body>
    <div class="auth-box">
        <div class="logo-icon">
            <i class="fas fa-comments"></i>
        </div>
        <h1>MegaChat</h1>
        <p class="subtitle">سجل دخولك للمتابعة</p>

        <div class="error-message" id="errorMsg">
            <i class="fas fa-exclamation-circle"></i>
            <span>البريد أو كلمة المرور غير صحيحة</span>
        </div>

        <form id="loginForm" onsubmit="return false;">
            <div class="form-group">
                <label>البريد الإلكتروني</label>
                <div class="input-wrapper">
                    <input 
                        type="email" 
                        id="email" 
                        placeholder="example@email.com" 
                        required
                        autocomplete="email"
                    >
                    <i class="fas fa-envelope"></i>
                </div>
            </div>

            <div class="form-group">
                <label>كلمة المرور</label>
                <div class="input-wrapper">
                    <input 
                        type="password" 
                        id="password" 
                        placeholder="••••••••" 
                        required
                        minlength="6"
                        autocomplete="current-password"
                    >
                    <i class="fas fa-lock"></i>
                </div>
            </div>

            <button type="submit" class="btn-login" id="loginBtn">
                <span>تسجيل الدخول</span>
                <i class="fas fa-arrow-left"></i>
            </button>
        </form>

        <div class="divider">أو</div>

        <div class="social-login">
            <button class="btn-social" onclick="socialLogin('google')" title="Google">
                <i class="fab fa-google"></i>
            </button>
            <button class="btn-social" onclick="socialLogin('apple')" title="Apple">
                <i class="fab fa-apple"></i>
            </button>
            <button class="btn-social" onclick="socialLogin('github')" title="GitHub">
                <i class="fab fa-github"></i>
            </button>
        </div>

        <div class="register-link">
            ليس لديك حساب؟ <a href="#" onclick="showRegister()">سجل الآن</a>
        </div>
    </div>

    <script>
        // تسجيل الدخول فوراً بدون انتظار
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            login();
        });

        function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('loginBtn');
            const errorMsg = document.getElementById('errorMsg');

            // التحقق البسيط
            if (!email || password.length < 6) {
                errorMsg.querySelector('span').textContent = 'أدخل بريد صحيح وكلمة مرور (6 أحرف على الأقل)';
                errorMsg.classList.add('show');
                setTimeout(() => errorMsg.classList.remove('show'), 3000);
                return;
            }

            // تغيير الزر ليثناء المعالجة
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> <span>جاري الدخول...</span>';
            btn.style.opacity = '0.8';

            // محاكاة تسجيل الدخول (فورية تقريباً)
            setTimeout(() => {
                // حفظ بيانات المستخدم
                const user = {
                    id: Date.now(),
                    name: email.split('@')[0],
                    email: email,
                    avatar: `https://i.pravatar.cc/150?img=${Math.floor(Math.random() * 70)}`,
                    loginTime: Date.now()
                };

                localStorage.setItem('megachat_user', JSON.stringify(user));
                localStorage.setItem('megachat_logged_in', 'true');

                // الانتقال فوراً للتطبيق
                window.location.replace('index.html');

            }, 800); // 800ms فقط للإحساس بالمعالجة
        }

        // تسجيل دخول اجتماعي
        function socialLogin(provider) {
            const btn = document.getElementById('loginBtn');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> <span>جاري الدخول...</span>';

            setTimeout(() => {
                const names = {
                    google: 'Google User',
                    apple: 'Apple User',
                    github: 'GitHub User'
                };

                const user = {
                    id: provider + '_' + Date.now(),
                    name: names[provider],
                    email: `user@${provider}.com`,
                    avatar: `https://i.pravatar.cc/150?img=${Math.floor(Math.random() * 70)}`,
                    provider: provider,
                    loginTime: Date.now()
                };

                localStorage.setItem('megachat_user', JSON.stringify(user));
                localStorage.setItem('megachat_logged_in', 'true');

                window.location.replace('index.html');
            }, 600);
        }

        // عرض نموذج التسجيل (يمكن تطويره لاحقاً)
        function showRegister() {
            alert('التسجيل: استخدم أي بريد وكلمة مرور (6 أحرف) للدخول');
        }

        // التحقق إذا كان مسجل مسبقاً
        if (localStorage.getItem('megachat_logged_in') === 'true') {
            window.location.replace('index.html');
        }

        // Enter للتنقل بين الحقول
        document.getElementById('email').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('password').focus();
            }
        });

        document.getElementById('password').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                login();
            }
        });
    </script>
</body>
</html>
