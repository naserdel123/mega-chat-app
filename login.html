<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MegaChat - تسجيل الدخول</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background: #0a0a0f;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* خلفية متحركة أسطورية */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
        }

        .bg-animation span {
            position: absolute;
            display: block;
            width: 20px;
            height: 20px;
            background: rgba(102, 126, 234, 0.3);
            animation: float-up 25s linear infinite;
            bottom: -150px;
            border-radius: 50%;
        }

        .bg-animation span:nth-child(1) { left: 25%; width: 80px; height: 80px; animation-delay: 0s; }
        .bg-animation span:nth-child(2) { left: 10%; width: 20px; height: 20px; animation-delay: 2s; animation-duration: 12s; }
        .bg-animation span:nth-child(3) { left: 70%; width: 20px; height: 20px; animation-delay: 4s; }
        .bg-animation span:nth-child(4) { left: 40%; width: 60px; height: 60px; animation-delay: 0s; animation-duration: 18s; }
        .bg-animation span:nth-child(5) { left: 65%; width: 20px; height: 20px; animation-delay: 0s; }
        .bg-animation span:nth-child(6) { left: 75%; width: 110px; height: 110px; animation-delay: 3s; }
        .bg-animation span:nth-child(7) { left: 35%; width: 150px; height: 150px; animation-delay: 7s; }
        .bg-animation span:nth-child(8) { left: 50%; width: 25px; height: 25px; animation-delay: 15s; animation-duration: 45s; }
        .bg-animation span:nth-child(9) { left: 20%; width: 15px; height: 15px; animation-delay: 2s; animation-duration: 35s; }
        .bg-animation span:nth-child(10) { left: 85%; width: 150px; height: 150px; animation-delay: 0s; animation-duration: 11s; }

        @keyframes float-up {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
                border-radius: 0;
            }
            100% {
                transform: translateY(-1000px) rotate(720deg);
                opacity: 0;
                border-radius: 50%;
            }
        }

        /* تأثير الإضاءة المتحركة */
        .light-effect {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(102, 126, 234, 0.4) 0%, transparent 70%);
            top: -300px;
            right: -300px;
            animation: pulse-light 8s ease-in-out infinite;
            filter: blur(60px);
        }

        .light-effect:nth-child(2) {
            background: radial-gradient(circle, rgba(240, 147, 251, 0.3) 0%, transparent 70%);
            bottom: -300px;
            left: -300px;
            top: auto;
            right: auto;
            animation-delay: 4s;
        }

        @keyframes pulse-light {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.2); opacity: 0.8; }
        }

        /* الحاوية الرئيسية */
        .container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 450px;
            padding: 20px;
        }

        /* شعار متحرك */
        .logo-container {
            text-align: center;
            margin-bottom: 40px;
            perspective: 1000px;
        }

        .logo-3d {
            width: 100px;
            height: 100px;
            margin: 0 auto 20px;
            position: relative;
            transform-style: preserve-3d;
            animation: logo-float 6s ease-in-out infinite;
        }

        @keyframes logo-float {
            0%, 100% { transform: translateY(0) rotateY(0deg); }
            50% { transform: translateY(-20px) rotateY(10deg); }
        }

        .logo-ring {
            position: absolute;
            inset: 0;
            border: 3px solid transparent;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 3s linear infinite;
        }

        .logo-ring:nth-child(2) {
            inset: 10px;
            border-top-color: #f093fb;
            animation-duration: 5s;
            animation-direction: reverse;
        }

        .logo-ring:nth-child(3) {
            inset: 20px;
            border-top-color: #4ade80;
            animation-duration: 7s;
        }

        .logo-icon {
            position: absolute;
            inset: 25px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            box-shadow: 0 0 60px rgba(102, 126, 234, 0.6);
            animation: glow 2s ease-in-out infinite;
        }

        @keyframes glow {
            0%, 100% { box-shadow: 0 0 60px rgba(102, 126, 234, 0.6); }
            50% { box-shadow: 0 0 100px rgba(102, 126, 234, 0.9), 0 0 140px rgba(240, 147, 251, 0.4); }
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .brand-name {
            font-size: 42px;
            font-weight: 900;
            background: linear-gradient(135deg, #667eea, #f093fb, #4ade80);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradient-shift 3s ease infinite;
            letter-spacing: 2px;
        }

        @keyframes gradient-shift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .brand-tagline {
            color: #a0a0b0;
            font-size: 14px;
            margin-top: 8px;
            opacity: 0;
            animation: fade-in-up 1s ease 0.5s forwards;
        }

        @keyframes fade-in-up {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* البطاقات المتحركة */
        .card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transform: translateY(50px);
            opacity: 0;
            animation: card-enter 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) 0.3s forwards;
        }

        @keyframes card-enter {
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        /* التبويبات */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            background: rgba(255, 255, 255, 0.05);
            padding: 5px;
            border-radius: 15px;
        }

        .tab {
            flex: 1;
            padding: 12px;
            background: none;
            border: none;
            color: #a0a0b0;
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border-radius: 10px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .tab::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, #667eea, #764ba2);
            opacity: 0;
            transition: opacity 0.3s ease;
            border-radius: 10px;
        }

        .tab span {
            position: relative;
            z-index: 1;
        }

        .tab.active {
            color: white;
        }

        .tab.active::before {
            opacity: 1;
        }

        /* النماذج */
        .form {
            display: none;
        }

        .form.active {
            display: block;
            animation: form-fade 0.4s ease;
        }

        @keyframes form-fade {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .input-group {
            margin-bottom: 20px;
            position: relative;
        }

        .input-group label {
            display: block;
            color: #a0a0b0;
            font-size: 13px;
            margin-bottom: 8px;
            transform: translateX(0);
            transition: all 0.3s ease;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: #6b7280;
            font-size: 18px;
            transition: all 0.3s ease;
        }

        input {
            width: 100%;
            padding: 16px 50px 16px 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            color: white;
            font-family: inherit;
            font-size: 15px;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
            background: rgba(102, 126, 234, 0.05);
            box-shadow: 0 0 20px rgba(102, 126, 234, 0.2);
        }

        input:focus + .input-icon {
            color: #667eea;
            transform: translateY(-50%) scale(1.1);
        }

        .input-group:focus-within label {
            color: #667eea;
            transform: translateX(-5px);
        }

        /* زر الإظهار/الإخفاء */
        .toggle-password {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #6b7280;
            cursor: pointer;
            font-size: 16px;
            padding: 5px;
            transition: all 0.3s ease;
        }

        .toggle-password:hover {
            color: #667eea;
            transform: translateY(-50%) scale(1.2);
        }

        /* زر الدخول */
        .btn-submit {
            width: 100%;
            padding: 18px;
            margin-top: 10px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            background-size: 200% 200%;
            border: none;
            border-radius: 16px;
            color: white;
            font-family: inherit;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
        }

        .btn-submit::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.5s ease;
        }

        .btn-submit:hover::before {
            left: 100%;
        }

        .btn-submit:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.4);
            animation: gradient-shift 2s ease infinite;
        }

        .btn-submit:active {
            transform: translateY(-1px);
        }

        .btn-submit.loading {
            pointer-events: none;
        }

        .btn-submit.loading::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            border: 2px solid transparent;
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            right: 20px;
            top: 50%;
            margin-top: -10px;
        }

        /* رابط نسيان كلمة المرور */
        .forgot-link {
            text-align: center;
            margin-top: 20px;
        }

        .forgot-link a {
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
            position: relative;
            transition: all 0.3s ease;
        }

        .forgot-link a::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 1px;
            background: #667eea;
            transition: width 0.3s ease;
        }

        .forgot-link a:hover::after {
            width: 100%;
        }

        /* رسائل الخطأ */
        .error-message {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #ef4444;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            margin-bottom: 20px;
            display: none;
            align-items: center;
            gap: 10px;
            animation: shake 0.5s ease;
        }

        .error-message.show {
            display: flex;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        /* نجاح */
        .success-message {
            background: rgba(74, 222, 128, 0.1);
            border: 1px solid rgba(74, 222, 128, 0.3);
            color: #4ade80;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            margin-bottom: 20px;
            display: none;
            align-items: center;
            gap: 10px;
        }

        .success-message.show {
            display: flex;
            animation: pulse 0.5s ease;
        }

        /* مودال إعادة تعيين */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            display: flex;
            opacity: 1;
        }

        .modal {
            background: #1a1a2e;
            border-radius: 30px;
            padding: 40px;
            width: 90%;
            max-width: 400px;
            transform: scale(0.9);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .modal-overlay.active .modal {
            transform: scale(1);
            opacity: 1;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .modal-header h3 {
            font-size: 24px;
        }

        .btn-close {
            background: none;
            border: none;
            color: #a0a0b0;
            font-size: 24px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-close:hover {
            color: #ef4444;
            transform: rotate(90deg);
        }

        /* تأثيرات إضافية */
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #667eea;
            border-radius: 50%;
            pointer-events: none;
        }

        @media (max-width: 480px) {
            .card {
                padding: 30px 20px;
            }
            
            .brand-name {
                font-size: 32px;
            }
        }
    </style>
</head>
<body>
    <!-- خلفية متحركة -->
    <div class="bg-animation">
        <span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span><span></span>
    </div>

    <!-- تأثيرات الإضاءة -->
    <div class="light-effect"></div>
    <div class="light-effect"></div>

    <!-- المحتوى الرئيسي -->
    <div class="container">
        <!-- الشعار -->
        <div class="logo-container">
            <div class="logo-3d">
                <div class="logo-ring"></div>
                <div class="logo-ring"></div>
                <div class="logo-ring"></div>
                <div class="logo-icon">
                    <i class="fas fa-comments"></i>
                </div>
            </div>
            <h1 class="brand-name">MegaChat</h1>
            <p class="brand-tagline">تواصل بلا حدود</p>
        </div>

        <!-- البطاقة -->
        <div class="card">
            <!-- التبويبات -->
            <div class="tabs">
                <button class="tab active" onclick="switchTab('login')">
                    <span>تسجيل الدخول</span>
                </button>
                <button class="tab" onclick="switchTab('register')">
                    <span>حساب جديد</span>
                </button>
            </div>

            <!-- رسائل -->
            <div class="error-message" id="errorMsg">
                <i class="fas fa-exclamation-circle"></i>
                <span></span>
            </div>
            <div class="success-message" id="successMsg">
                <i class="fas fa-check-circle"></i>
                <span></span>
            </div>

            <!-- نموذج الدخول -->
            <form class="form active" id="loginForm" onsubmit="return false;">
                <div class="input-group">
                    <label>البريد الإلكتروني أو اسم المستخدم</label>
                    <div class="input-wrapper">
                        <input type="text" id="loginUsername" placeholder="example@email.com أو username" required>
                        <i class="fas fa-user input-icon"></i>
                    </div>
                </div>

                <div class="input-group">
                    <label>كلمة المرور</label>
                    <div class="input-wrapper">
                        <input type="password" id="loginPassword" placeholder="••••••••" required minlength="6">
                        <i class="fas fa-lock input-icon"></i>
                        <button type="button" class="toggle-password" onclick="togglePassword('loginPassword')">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-submit" id="loginBtn" onclick="login()">
                    دخول
                </button>

                <div class="forgot-link">
                    <a href="#" onclick="showResetModal()">نسيت كلمة المرور؟</a>
                </div>
            </form>

            <!-- نموذج التسجيل -->
            <form class="form" id="registerForm" onsubmit="return false;">
                <div class="input-group">
                    <label>الاسم الكامل</label>
                    <div class="input-wrapper">
                        <input type="text" id="regName" placeholder="محمد أحمد" required>
                        <i class="fas fa-user input-icon"></i>
                    </div>
                </div>

                    <label>اسم ال
